# Ouvidoria Municipal - ambiente segmentado com firewall iptables
# Subir: docker compose up -d --build
name: ouvidoria

x-senhas: &senhas   # padrao do laboratorio; troque criando um arquivo .env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root_Lab_2026}
  DB_READ_PASSWORD: ${DB_READ_PASSWORD:-Leitura_Lab_2026}
  DB_SISTEMA_PASSWORD: ${DB_SISTEMA_PASSWORD:-Sistema_Lab_2026}

services:

  # ---------------- FIREWALL / GATEWAY ----------------
  firewall:
    build: ./firewall
    container_name: firewall
    cap_add: [NET_ADMIN]                  # permite usar iptables
    sysctls:
      - net.ipv4.ip_forward=1             # liga o roteamento entre as redes
    ports:
      - "127.0.0.1:8080:80"               # portal no navegador do Windows (lado Internet)
    networks:
      rede_internet: { ipv4_address: 203.0.113.254 }
      rede_lan:      { ipv4_address: 10.10.10.254 }
      rede_dmz:      { ipv4_address: 10.10.20.254 }

  # ---------------- DMZ ----------------
  dmz-web:                                # portal publico (somente leitura)
    build: ./web
    container_name: dmz-web
    environment:
      DB_HOST: 10.10.20.20
      DB_NAME: ouvidoria
      DB_USER: ouvidoria_leitura
      DB_PASS: ${DB_READ_PASSWORD:-Leitura_Lab_2026}
    networks:
      rede_dmz: { ipv4_address: 10.10.20.10 }

  dmz-db:
    build: ./db
    container_name: dmz-db
    environment:
      <<: *senhas
      MYSQL_ROOT_HOST: localhost          # root nao acessa pela rede
      MYSQL_DATABASE: ouvidoria
    volumes:
      - dados_mysql:/var/lib/mysql        # dados persistentes
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      rede_dmz: { ipv4_address: 10.10.20.20 }

  # ---------------- LAN (rede cliente) ----------------
  lan-estacao:                            # estacao de trabalho de um servidor
    build: ./ferramentas
    container_name: lan-estacao
    networks:
      rede_lan: { ipv4_address: 10.10.10.10 }

  lan-sistema:                            # sistema interno: cadastra/altera/exclui
    build: ./sistema-interno
    container_name: lan-sistema
    environment:
      DB_HOST: 10.10.10.254               # banco publicado pelo firewall (regra R3)
      DB_NAME: ouvidoria
      DB_USER: ouvidoria_sistema
      DB_PASS: ${DB_SISTEMA_PASSWORD:-Sistema_Lab_2026}
    networks:
      rede_lan: { ipv4_address: 10.10.10.20 }

  # ---------------- INTERNET ----------------
  net-cidadao:                            # cidadao acessando pela Internet
    build: ./ferramentas
    container_name: net-cidadao
    networks:
      rede_internet: { ipv4_address: 203.0.113.50 }

networks:
  rede_internet:                          # simula a Internet
    ipam: { config: [ { subnet: 203.0.113.0/24 } ] }
  rede_lan:                               # rede interna da prefeitura
    internal: true                        # sem saida pelo host: so via firewall
    ipam: { config: [ { subnet: 10.10.10.0/24 } ] }
  rede_dmz:                               # zona desmilitarizada
    internal: true
    ipam: { config: [ { subnet: 10.10.20.0/24 } ] }

volumes:
  dados_mysql: